<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Time Zones</title>
  <link rel="stylesheet" href="style.css" />
  <script src="popup.js" defer></script>
</head>

<body>
  <main class="container">
    <header>
      <div>
        <h1>US Time Zones</h1>
        <p id="date">Loading date...</p>
      </div>
      <span class="live"><span></span> LIVE</span>
    </header>

    <section id="timezone-list"></section>

    <footer>
      <span>Updated every second</span>
      <button id="refresh" title="Refresh times">↻</button>
    </footer>
  </main>
</body>

</html>
